<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graph War V0.5 Ballistics Test</title>
<style>
:root{
  --paper:#f8f3e8;--ink:#17395f;--ink2:#42678f;--grid:rgba(75,145,194,.19);
  --red:#a43c33;--muted:#73786f;--line:#c6b99d;--green:#4f765d
}
*{box-sizing:border-box}
body{margin:0;background:#e8edf1;color:#243447;font-family:"Courier New",monospace}
main{max-width:980px;margin:auto;padding:16px}
h1{margin:0;color:var(--ink);font-size:34px;letter-spacing:-1px}
.sub{font-size:12px;color:var(--muted);margin:4px 0 14px}
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 12px rgba(50,40,30,.08)}
.wrap{display:grid;grid-template-columns:1fr 280px;gap:14px}
.board{position:relative;min-height:560px;overflow:hidden}
svg{display:block;width:100%;height:100%}
.panel{padding:14px}
.panel h2{margin:0 0 8px;color:var(--ink);font-size:16px}
.control{margin:14px 0}
label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink)}
input[type=range]{width:100%}
.btn{width:100%;min-height:46px;border:2px solid var(--ink);background:#eef5fb;color:var(--ink);font:inherit;font-weight:700;border-radius:5px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.readout{font-size:12px;line-height:1.55;border-top:1px dashed #b7aa8e;padding-top:10px;margin-top:10px}
.legend{font-size:11px;color:var(--muted);margin-top:10px}
.status{margin-top:12px;padding:10px;border-top:2px solid var(--red);color:var(--red);font-weight:700;text-align:center;background:rgba(255,255,255,.35)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.board{min-height:470px}}
</style>
</head>
<body>
<main>
  <h1>GRAPH WAR <span style="font-size:12px;font-weight:400">V0.5 BALLISTICS TEST</span></h1>
  <div class="sub">Angle + power + projected arc + landing reticle + impact feedback</div>

  <div class="wrap">
    <section class="paper board">
      <svg id="scene" viewBox="0 0 800 560" aria-label="Graph War ballistics test field">
        <defs>
          <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
            <path d="M28 0H0V28" fill="none" stroke="#6aa2c8" stroke-opacity=".18" stroke-width="1"/>
          </pattern>
          <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        <rect x="0" y="0" width="800" height="560" fill="#f8f3e8"/>
        <rect x="0" y="0" width="800" height="560" fill="url(#grid)"/>

        <path d="M0 430 C120 400 180 455 290 430 S500 390 620 430 S760 470 800 450 L800 560 L0 560 Z"
              fill="#d8cfb8" stroke="#6f6a5f" stroke-width="2" opacity=".9"/>

        <g id="gun" transform="translate(80 420)">
          <circle cx="0" cy="0" r="16" fill="#f8f3e8" stroke="#17395f" stroke-width="3"/>
          <line id="barrel" x1="0" y1="0" x2="68" y2="0" stroke="#17395f" stroke-width="7" stroke-linecap="round"/>
          <text x="-34" y="38" fill="#17395f" font-size="14">WEST GUN</text>
        </g>

        <g id="targetShip" opacity="0">
          <path d="M0 0 C20 -10 70 -10 95 0 L82 16 H15 Z" fill="#17395f" fill-opacity=".15" stroke="#17395f" stroke-width="2"/>
        </g>

        <path id="previewArc" d="" fill="none" stroke="#17395f" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 8"/>
        <ellipse id="reticle" cx="0" cy="0" rx="34" ry="18" fill="#a43c33" fill-opacity=".09" stroke="#a43c33" stroke-opacity=".45" stroke-width="2" stroke-dasharray="7 6"/>
        <text id="reticleLabel" x="0" y="0" fill="#a43c33" font-size="12">EST. SPLASH</text>
        <text id="rangeLabel" x="0" y="0" fill="#a43c33" font-size="12"></text>

        <circle id="shell" cx="-50" cy="-50" r="5" fill="#a43c33" opacity="0"/>
        <g id="impact" opacity="0">
          <path d="M-16 0 L16 0 M0 -16 L0 16 M-11 -11 L11 11 M11 -11 L-11 11" stroke="#a43c33" stroke-width="3"/>
        </g>

        <text x="610" y="42" fill="#17395f" font-size="14">EAST THEATER</text>
        <text x="610" y="60" fill="#73786f" font-size="11">hidden fleet sector</text>
      </svg>
    </section>

    <aside class="paper panel">
      <h2>FIRING SOLUTION</h2>

      <div class="control">
        <label><span>ANGLE</span><span id="angleVal">45°</span></label>
        <input id="angle" type="range" min="15" max="75" value="45">
      </div>

      <div class="control">
        <label><span>POWER</span><span id="powerVal">65%</span></label>
        <input id="power" type="range" min="25" max="100" value="65">
      </div>

      <button id="fire" class="btn" type="button">FIRE</button>

      <div class="readout">
        <div>Estimated range: <strong id="rangeVal">—</strong></div>
        <div>Landing sector: <strong id="sectorVal">—</strong></div>
        <div>Guide: <strong id="guideVal">IN RANGE</strong></div>
      </div>

      <div class="legend">
        The translucent reticle shows the expected landing zone, not a guaranteed impact point.
      </div>

      <div id="status" class="status">Adjust angle and power.</div>
    </aside>
  </div>
</main>

<script>
(function(){
  "use strict";
  var angle=document.getElementById("angle");
  var power=document.getElementById("power");
  var angleVal=document.getElementById("angleVal");
  var powerVal=document.getElementById("powerVal");
  var rangeVal=document.getElementById("rangeVal");
  var sectorVal=document.getElementById("sectorVal");
  var guideVal=document.getElementById("guideVal");
  var preview=document.getElementById("previewArc");
  var reticle=document.getElementById("reticle");
  var reticleLabel=document.getElementById("reticleLabel");
  var rangeLabel=document.getElementById("rangeLabel");
  var barrel=document.getElementById("barrel");
  var shell=document.getElementById("shell");
  var impact=document.getElementById("impact");
  var status=document.getElementById("status");
  var fire=document.getElementById("fire");
  var targetShip=document.getElementById("targetShip");

  var origin={x:80,y:420};
  var target={x:635,y:425,w:95,h:16};
  targetShip.setAttribute("transform","translate("+target.x+" "+target.y+")");

  function solution(){
    var deg=+angle.value, p=+power.value;
    var rad=deg*Math.PI/180;
    var range=(p/100)*760*Math.sin(rad*2);
    var x=Math.max(110,Math.min(760,origin.x+range));
    var apex=Math.max(90,origin.y-(p*3.1*Math.sin(rad)));
    var inRange=x>=540;
    return {deg:deg,p:p,x:x,y:425,apex:apex,inRange:inRange};
  }

  function sectorFromX(x){
    var idx=Math.max(0,Math.min(9,Math.floor((x-500)/28)));
    return String.fromCharCode(65+idx)+"8";
  }

  function pathFor(s){
    var cx=(origin.x+s.x)/2;
    return "M "+origin.x+" "+origin.y+" Q "+cx+" "+s.apex+" "+s.x+" "+s.y;
  }

  function update(){
    var s=solution();
    angleVal.textContent=s.deg+"°";
    powerVal.textContent=s.p+"%";
    rangeVal.textContent=Math.round(s.x-origin.x)+" units";
    sectorVal.textContent=sectorFromX(s.x);
    guideVal.textContent=s.inRange?"IN RANGE":"SHORT";
    guideVal.style.color=s.inRange?"#4f765d":"#a43c33";

    preview.setAttribute("d",pathFor(s));
    reticle.setAttribute("cx",s.x);
    reticle.setAttribute("cy",s.y);
    reticle.setAttribute("rx",s.inRange?34:44);
    reticle.setAttribute("ry",s.inRange?18:22);
    reticle.setAttribute("stroke-opacity",s.inRange?".48":".25");
    reticleLabel.setAttribute("x",s.x-36);
    reticleLabel.setAttribute("y",s.y-28);
    rangeLabel.textContent=s.inRange?"":"SHORT";
    rangeLabel.setAttribute("x",s.x-18);
    rangeLabel.setAttribute("y",s.y+38);

    var brad=-s.deg*Math.PI/180;
    barrel.setAttribute("x2",68*Math.cos(brad));
    barrel.setAttribute("y2",68*Math.sin(brad));
  }

  function pointOnQuad(t,x0,y0,cx,cy,x1,y1){
    var a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;
    return {x:a*x0+b*cx+c*x1,y:a*y0+b*cy+c*y1};
  }

  function shoot(){
    fire.disabled=true;
    var s=solution();
    var cx=(origin.x+s.x)/2;
    shell.setAttribute("opacity","1");
    impact.setAttribute("opacity","0");
    status.textContent="SHOT AWAY…";

    var start=performance.now(),duration=1150;
    function frame(now){
      var t=Math.min(1,(now-start)/duration);
      var pt=pointOnQuad(t,origin.x,origin.y,cx,s.apex,s.x,s.y);
      shell.setAttribute("cx",pt.x);
      shell.setAttribute("cy",pt.y);
      if(t<1){requestAnimationFrame(frame);return}

      shell.setAttribute("opacity","0");
      impact.setAttribute("transform","translate("+s.x+" "+s.y+")");
      impact.setAttribute("opacity","1");

      var hit=s.x>=target.x && s.x<=target.x+target.w;
      if(hit){
        targetShip.setAttribute("opacity","1");
        status.textContent="HIT — firing solution confirmed";
      }else if(s.inRange){
        status.textContent="MISS — adjust from last impact";
      }else{
        status.textContent="SHORT — increase power or alter angle";
      }
      fire.disabled=false;
    }
    requestAnimationFrame(frame);
  }

  angle.addEventListener("input",update);
  power.addEventListener("input",update);
  fire.addEventListener("click",shoot);
  update();
})();
</script>
</body>
</html>
